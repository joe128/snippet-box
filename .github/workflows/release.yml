name: Generate Changelog and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Which release bump should be made?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      security_scan:
        description: 'Like the cron-job: scan the image and only rebuild if vulnerabilities are found'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 0'

# never run two releases at once (e.g. weekly scan + push) - they would race for the tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-current-vulnerabilities:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.security_scan == true
    outputs:
      vulnerable: ${{ steps.evaluate.outputs.vulnerable }}
    steps:
      - name: Compute image reference
        id: image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}"
          echo "ref=${IMAGE,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Run Trivy on Registry Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Evaluate vulnerability status
        id: evaluate
        run: |
          trivy convert --format table --scanners vuln trivy-results.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "=============================================================================="
            echo "LOG: $COUNT vulnerabilities found in the current image! Proceeding with the build and patch process."
            echo "=============================================================================="
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          else
            echo "=============================================================================="
            echo "LOG: No vulnerabilities found in the current image. The image is safe. Skipping rebuild."
            echo "=============================================================================="
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    needs: check-current-vulnerabilities
    if: |
      always() &&
      (
        needs.check-current-vulnerabilities.result == 'skipped' ||
        (needs.check-current-vulnerabilities.result == 'success' && needs.check-current-vulnerabilities.outputs.vulnerable == 'true')
      ) &&
      !contains(github.event.head_commit.message, '[skip ci]')
    uses: ./.github/workflows/tests.yml
    with:
      no-cache: ${{ github.event_name == 'schedule' || inputs.security_scan == true }}

  release-and-changelog:
    runs-on: ubuntu-latest
    needs: run-tests
    if: |
      always() &&
      needs.run-tests.result == 'success'
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      # Written to runner.temp, NOT into the repo: the changelog action commits with
      # `git add .`, so a file inside the checkout would end up in the release commit
      - name: Create Custom Conventional Changelog Config
        if: ${{ github.event.inputs.release_type != '' || github.event_name == 'schedule' }}
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'patch' }}"
          echo "Writing release override for: $RELEASE_TYPE"
          cat << EOF > "${{ runner.temp }}/changelog-config.js"
          module.exports = {
            preset: {
              name: 'conventionalcommits'
            },
            recommendedBumpOpts: {
              whatBump: (commits) => {
                return {
                  level: '$RELEASE_TYPE' === 'major' ? 0 : '$RELEASE_TYPE' === 'minor' ? 1 : 2,
                  reason: 'Manually chosen release type (or security patch): $RELEASE_TYPE'
                };
              }
            }
          };
          EOF

      - name: Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.PAT }}
          # the current version is read from (and the bump written to) both files
          version-file: './package.json, ./client/package.json'
          git-message: "chore(release): {version} [skip ci]"
          tag-prefix: ""
          input-file: CHANGELOG.md
          # if manually started or security patch, force version and ignore empty commits
          preset: ${{ (github.event.inputs.release_type != '' || github.event_name == 'schedule') && '' || 'conventionalcommits' }}
          skip-on-empty: ${{ github.event_name == 'push' }}
          config-file-path: ${{ (github.event.inputs.release_type != '' || github.event_name == 'schedule') && format('{0}/changelog-config.js', runner.temp) || '' }}
          git-user-name: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: steps.changelog.outputs.skipped == 'false'
        with:
          name: ${{ steps.changelog.outputs.tag }}
          tag_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.PAT }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: release-and-changelog
    if: |
      always() &&
      needs.release-and-changelog.result == 'success' &&
      needs.release-and-changelog.outputs.skipped == 'false'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-and-changelog.outputs.tag || 'main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Generate docker Meta-Data
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-and-changelog.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-and-changelog.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release-and-changelog.outputs.tag }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.security_scan == true }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
