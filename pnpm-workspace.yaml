packages:
  - client

allowBuilds:
  sqlite3: true
  # only verifies its platform binary (via tsx) - not needed
  esbuild: false

overrides:
  # GHSA-w5hq-g745-h8pq (pulled in by sequelize)
  uuid: ^14.0.0

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS, no patched release yet. Pulled in via
    # sqlite3 > node-gyp (build-time fallback) and umzug > tinyglobby; the app
    # lists its migrations explicitly and never passes input to glob matching.
    # Remove once picomatch ships a fix.
    - GHSA-fc5q-39xc-vjpf
