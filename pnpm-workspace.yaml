packages:
  - client

allowBuilds:
  sqlite3: true
  # only verifies its platform binary (via tsx) - not needed
  esbuild: false

overrides:
  # GHSA-w5hq-g745-h8pq (pulled in by sequelize)
  uuid: ^11.1.1

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS, no patched release yet. Only reached via
    # sqlite3 > node-gyp (optional, build-time fallback for compiling the
    # native binding); the app never passes user input to glob matching.
    # Remove once picomatch ships a fix.
    - GHSA-fc5q-39xc-vjpf
